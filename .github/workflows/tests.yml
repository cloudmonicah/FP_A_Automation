name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-github-actions-annotate-failures
      - run: python -m compileall -q automations shared ui scripts app.py main.py config.py
      - run: python -m pytest -q
